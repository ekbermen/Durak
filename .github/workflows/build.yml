name: DarkForge Standalone Hile Durak Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Operasyon Merkezini Kur (Checkout)
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Android SDK Kurulumu
      uses: android-actions/setup-android@v3

    - name: 4. Gradle Ortamını Hazırla
      uses: gradle/actions/setup-gradle@v3

    - name: 5. Proje Yapısını Oluştur (Sıfırdan APK Projesi)
      run: |
        echo "[DarkForge] Proje iskeleti oluşturuluyor..."
        mkdir -p app/src/main/java/com/darkforge/hiledurak
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values

    - name: 6. Gradle Dosyalarını Yaz
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "HileDurak"
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.darkforge.hiledurak'
            compileSdk 34
            defaultConfig {
                applicationId "com.darkforge.hiledurak"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

    - name: 7. AndroidManifest.xml (İzinler ve Servisler) Yaz
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_launcher"
                android:label="Hile Durak"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                
                <activity android:name=".GameActivity" />
                <service android:name=".OverlayService" android:exported="false" />
            </application>
        </manifest>
        EOF

    - name: 8. Görsel Tasarımları ve Renkleri (Drawables, Styles) Yaz
      run: |
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FF0000" android:pathData="M12,2L2,22h20L12,2z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/df_circle.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#DD000000"/>
            <stroke android:width="3dp" android:color="#FF0000"/>
            <size android:width="60dp" android:height="60dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Hile Durak</string>
        </resources>
        EOF
        
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.AppCompat.NoActionBar" parent="android:Theme.Material.NoActionBar">
                <item name="android:windowBackground">@android:color/black</item>
            </style>
        </resources>
        EOF

    - name: 9. Arayüz Tasarımlarını (Launcher, Oyun, Overlay) Yaz
      run: |
        # 1. Hile Başlat Ekranı
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0A0A0A"
            android:gravity="center">
            <TextView
                android:id="@+id/title"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="DARKFORGE"
                android:textColor="#FF0000"
                android:textSize="40sp"
                android:textStyle="bold"
                android:layout_centerHorizontal="true"
                android:layout_marginTop="100dp"/>
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="CYBER WEAPON v1.0"
                android:textColor="#00FF00"
                android:layout_below="@id/title"
                android:layout_centerHorizontal="true"/>
            <Button
                android:id="@+id/btn_start"
                android:layout_width="250dp"
                android:layout_height="60dp"
                android:text="HİLEYİ BAŞLAT"
                android:textColor="#FFFFFF"
                android:backgroundTint="#FF0000"
                android:layout_centerInParent="true"
                android:layout_marginTop="50dp"/>
        </RelativeLayout>
        EOF

        # 2. Oyun Ekranı (Durak Simülasyonu)
        cat << 'EOF' > app/src/main/res/layout/activity_game.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#1A1A1A">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="DURAK OYUNU BAŞLATILDI"
                android:textColor="#00FF00"
                android:textSize="24sp"
                android:textStyle="bold"
                android:layout_centerInParent="true"/>
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Köşedeki DF logosuna tıklayarak hile menüsünü açabilirsin."
                android:textColor="#FFFFFF"
                android:textSize="14sp"
                android:layout_below="@id/title"
                android:layout_centerHorizontal="true"
                android:layout_marginTop="20dp"
                android:id="@+id/title"/>
        </RelativeLayout>
        EOF

        # 3. Overlay Menü (Yuvarlak Logo ve Açılır Pencere)
        cat << 'EOF' > app/src/main/res/layout/overlay_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content">
            <LinearLayout
                android:id="@+id/menu_panel"
                android:layout_width="220dp"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="#CC000000"
                android:padding="10dp"
                android:visibility="gone"
                android:layout_above="@+id/logo_btn"
                android:layout_alignParentRight="true">
                <TextView
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="DARKFORGE MENÜ"
                    android:textColor="#FF0000"
                    android:textStyle="bold"
                    android:gravity="center"
                    android:paddingBottom="5dp"/>
                <Button android:id="@+id/btn_money" android:layout_width="match_parent" android:layout_height="40dp" android:text="SINIRSIZ PARA" android:textSize="12sp" android:textColor="#00FF00"/>
                <Button android:id="@+id/btn_cards" android:layout_width="match_parent" android:layout_height="40dp" android:text="KARTLARI GÖSTER" android:textSize="12sp" android:textColor="#00FF00"/>
                <Button android:id="@+id/btn_lag" android:layout_width="match_parent" android:layout_height="40dp" android:text="RAKİBİ ENGELLE" android:textSize="12sp" android:textColor="#FF0000"/>
            </LinearLayout>
            <Button
                android:id="@+id/logo_btn"
                android:layout_width="60dp"
                android:layout_height="60dp"
                android:text="DF"
                android:textSize="20sp"
                android:textStyle="bold"
                android:textColor="#FFFFFF"
                android:background="@drawable/df_circle"
                android:layout_alignParentRight="true"/>
        </RelativeLayout>
        EOF

    - name: 10. Java Kaynak Kodlarını (Main, Game, Overlay) Yaz
      run: |
        cat << 'EOF' > app/src/main/java/com/darkforge/hiledurak/MainActivity.java
        package com.darkforge.hiledurak;
        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                Button btn = findViewById(R.id.btn_start);
                btn.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        startActivity(new Intent(MainActivity.this, GameActivity.class));
                    }
                });
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/darkforge/hiledurak/GameActivity.java
        package com.darkforge.hiledurak;
        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import android.net.Uri;
        import android.provider.Settings;

        public class GameActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_game);
                
                // Overlay izni kontrolü
                if (!Settings.canDrawOverlays(this)) {
                    Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                    startActivityForResult(intent, 123);
                } else {
                    startService(new Intent(this, OverlayService.class));
                }
            }
            
            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                super.onActivityResult(requestCode, resultCode, data);
                if (requestCode == 123) {
                    if (Settings.canDrawOverlays(this)) {
                        startService(new Intent(this, OverlayService.class));
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/darkforge/hiledurak/OverlayService.java
        package com.darkforge.hiledurak;
        import android.app.Service;
        import android.content.Intent;
        import android.graphics.PixelFormat;
        import android.os.IBinder;
        import android.view.LayoutInflater;
        import android.view.View;
        import android.view.WindowManager;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.Toast;

        public class OverlayService extends Service {
            private WindowManager wm;
            private View overlayView;

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public void onCreate() {
                super.onCreate();
                wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_menu, null);

                int LAYOUT_FLAG;
                if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                    LAYOUT_FLAG = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                } else {
                    LAYOUT_FLAG = WindowManager.LayoutParams.TYPE_PHONE;
                }

                WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        LAYOUT_FLAG,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT);

                params.gravity = android.view.Gravity.TOP | android.view.Gravity.LEFT;
                params.x = 0;
                params.y = 100;

                wm.addView(overlayView, params);

                final LinearLayout menu = overlayView.findViewById(R.id.menu_panel);
                Button logo = overlayView.findViewById(R.id.logo_btn);
                
                logo.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        if (menu.getVisibility() == View.GONE) {
                            menu.setVisibility(View.VISIBLE);
                        } else {
                            menu.setVisibility(View.GONE);
                        }
                    }
                });

                overlayView.findViewById(R.id.btn_money).setOnClickListener(new View.OnClickListener() {
                    public void onClick(View v) { Toast.makeText(getApplicationContext(), "Sınırsız Para Aktif!", Toast.LENGTH_SHORT).show(); }
                });
                overlayView.findViewById(R.id.btn_cards).setOnClickListener(new View.OnClickListener() {
                    public void onClick(View v) { Toast.makeText(getApplicationContext(), "Kartlar Gösteriliyor!", Toast.LENGTH_SHORT).show(); }
                });
                overlayView.findViewById(R.id.btn_lag).setOnClickListener(new View.OnClickListener() {
                    public void onClick(View v) { Toast.makeText(getApplicationContext(), "Rakip Engellendi!", Toast.LENGTH_SHORT).show(); }
                });
            }

            @Override
            public void onDestroy() {
                super.onDestroy();
                if (wm != null && overlayView != null) {
                    wm.removeView(overlayView);
                }
            }
        }
        EOF

    - name: 11. APK Derle (Gradle Build)
      run: |
        echo "[DarkForge] Sıfırdan Hile Durak APK derleniyor..."
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk HileDurak.apk

    - name: 12. Nihai APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: HileDurak-APK
        path: HileDurak.apk
