name: DarkForge Hile Durak (Final - Root Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Operasyon Merkezini Kur
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. DarkForge ASCII Logosunu Çiz
      run: |
        sudo apt-get update && sudo apt-get install -y figlet
        figlet -f slant "DarkForge"
        echo "[DarkForge] Cyber Weapon Builder Hazır."

    - name: 4. Android SDK Araçlarını Kur
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools latest
        cd latest
        yes | ./bin/sdkmanager --licenses || true
        ./bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
        echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

    - name: 5. Proje Yapısını Oluştur
      run: |
        mkdir -p app/src/main/java/com/darkforge/hiledurak
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values

    - name: 6. AndroidManifest.xml Yaz
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.darkforge.hiledurak" android:versionCode="1" android:versionName="1.0">
        <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
        <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
        <application android:allowBackup="true" android:icon="@drawable/app_icon" android:label="Hile Durak" android:theme="@android:style/Theme.Material.NoActionBar">
        <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
        <intent-filter>
        <action android:name="android.intent.action.MAIN" />
        <category android:name="android.intent.category.LAUNCHER" />
        </intent-filter>
        </activity>
        <activity android:name=".GameActivity" android:exported="false" android:screenOrientation="portrait"/>
        <service android:name=".OverlayService" android:exported="false" />
        </application>
        </manifest>
        EOF

    - name: 7. İkon ve Yuvarlak Buton Tasarımını Yaz
      run: |
        cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
        <path android:fillColor="#111111" android:pathData="M0,0h108v108h-108z" />
        <path android:fillColor="#FF0000" android:pathData="M34,20 L74,20 A10,10 0 0,1 84,30 L84,78 A10,10 0 0,1 74,88 L34,88 A10,10 0 0,1 24,78 L24,30 A10,10 0 0,1 34,20 Z" />
        <path android:fillColor="#222222" android:pathData="M30,28 L78,28 A6,6 0 0,1 84,34 L84,74 A6,6 0 0,1 78,80 L30,80 A6,6 0 0,1 24,74 L24,34 A6,6 0 0,1 30,28 Z" />
        <path android:fillColor="#FFFFFF" android:pathData="M58,38 L42,56 L52,56 L48,72 L66,52 L54,52 Z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/df_circle.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
        <solid android:color="#DD000000"/>
        <stroke android:width="3dp" android:color="#FF0000"/>
        <size android:width="60dp" android:height="60dp"/>
        </shape>
        EOF

    - name: 8. Arayüz Layout'larını Yaz
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0A0A0A" android:gravity="center">
        <TextView android:id="@+id/title" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="DARKFORGE" android:textColor="#FF0000" android:textSize="40sp" android:textStyle="bold" android:layout_centerHorizontal="true" android:layout_marginTop="100dp"/>
        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="CYBER WEAPON v1.0" android:textColor="#00FF00" android:layout_below="@id/title" android:layout_centerHorizontal="true"/>
        <Button android:id="@+id/btn_start" android:layout_width="250dp" android:layout_height="60dp" android:text="HİLEYİ BAŞLAT" android:textColor="#FFFFFF" android:backgroundTint="#FF0000" android:layout_centerInParent="true" android:layout_marginTop="50dp"/>
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_game.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#1A1A1A">
        <TextView android:id="@+id/title_game" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="DURAK OYUNU BAŞLATILDI" android:textColor="#00FF00" android:textSize="24sp" android:textStyle="bold" android:layout_centerInParent="true"/>
        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Sağ üstteki DF logosuna tıklayarak hile menüsünü aç." android:textColor="#FFFFFF" android:textSize="14sp" android:layout_below="@id/title_game" android:layout_centerHorizontal="true" android:layout_marginTop="20dp"/>
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/overlay_menu.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="wrap_content" android:layout_height="wrap_content">
        <LinearLayout android:id="@+id/menu_panel" android:layout_width="220dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="#CC000000" android:padding="10dp" android:visibility="gone" android:layout_above="@+id/logo_btn" android:layout_alignParentRight="true">
        <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="DARKFORGE MENÜ" android:textColor="#FF0000" android:textStyle="bold" android:gravity="center" android:paddingBottom="5dp"/>
        <Button android:id="@+id/btn_money" android:layout_width="match_parent" android:layout_height="40dp" android:text="SINIRSIZ PARA" android:textSize="12sp" android:textColor="#00FF00"/>
        <Button android:id="@+id/btn_cards" android:layout_width="match_parent" android:layout_height="40dp" android:text="KARTLARI GÖSTER" android:textSize="12sp" android:textColor="#00FF00"/>
        <Button android:id="@+id/btn_lag" android:layout_width="match_parent" android:layout_height="40dp" android:text="RAKİBİ ENGELLE" android:textSize="12sp" android:textColor="#FF0000"/>
        </LinearLayout>
        <Button android:id="@+id/logo_btn" android:layout_width="60dp" android:layout_height="60dp" android:text="DF" android:textSize="20sp" android:textStyle="bold" android:textColor="#FFFFFF" android:background="@drawable/df_circle" android:layout_alignParentRight="true"/>
        </RelativeLayout>
        EOF

    - name: 9. Java Sınıflarını Yaz
      run: |
        cat << 'EOF' > app/src/main/java/com/darkforge/hiledurak/MainActivity.java
        package com.darkforge.hiledurak;
        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        public class MainActivity extends Activity {
        @Override protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState); setContentView(R.layout.activity_main);
        Button btn = findViewById(R.id.btn_start);
        btn.setOnClickListener(new View.OnClickListener() {
        @Override public void onClick(View v) { startActivity(new Intent(MainActivity.this, GameActivity.class)); }
        });
        }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/darkforge/hiledurak/GameActivity.java
        package com.darkforge.hiledurak;
        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        import android.net.Uri;
        import android.provider.Settings;
        public class GameActivity extends Activity {
        @Override protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState); setContentView(R.layout.activity_game);
        if (!Settings.canDrawOverlays(this)) {
        Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
        startActivityForResult(intent, 123);
        } else { startService(new Intent(this, OverlayService.class)); }
        }
        @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode == 123 && Settings.canDrawOverlays(this)) { startService(new Intent(this, OverlayService.class)); }
        }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/darkforge/hiledurak/OverlayService.java
        package com.darkforge.hiledurak;
        import android.app.Service;
        import android.content.Intent;
        import android.graphics.PixelFormat;
        import android.os.IBinder;
        import android.view.LayoutInflater;
        import android.view.View;
        import android.view.WindowManager;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.Toast;
        public class OverlayService extends Service {
        private WindowManager wm;
        private View overlayView;
        @Override public IBinder onBind(Intent intent) { return null; }
        @Override public void onCreate() {
        super.onCreate();
        wm = (WindowManager) getSystemService(WINDOW_SERVICE);
        overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_menu, null);
        int LAYOUT_FLAG = (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
        WindowManager.LayoutParams params = new WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, LAYOUT_FLAG, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
        params.gravity = android.view.Gravity.TOP | android.view.Gravity.RIGHT;
        params.x = 0; params.y = 100;
        wm.addView(overlayView, params);
        final LinearLayout menu = overlayView.findViewById(R.id.menu_panel);
        Button logo = overlayView.findViewById(R.id.logo_btn);
        logo.setOnClickListener(new View.OnClickListener() {
        @Override public void onClick(View v) { menu.setVisibility(menu.getVisibility() == View.GONE ? View.VISIBLE : View.GONE); }
        });
        overlayView.findViewById(R.id.btn_money).setOnClickListener(new View.OnClickListener() {
        public void onClick(View v) { Toast.makeText(getApplicationContext(), "Sınırsız Para Aktif!", Toast.LENGTH_SHORT).show(); }
        });
        overlayView.findViewById(R.id.btn_cards).setOnClickListener(new View.OnClickListener() {
        public void onClick(View v) { Toast.makeText(getApplicationContext(), "Kartlar Gösteriliyor!", Toast.LENGTH_SHORT).show(); }
        });
        overlayView.findViewById(R.id.btn_lag).setOnClickListener(new View.OnClickListener() {
        public void onClick(View v) { Toast.makeText(getApplicationContext(), "Rakip Engellendi!", Toast.LENGTH_SHORT).show(); }
        });
        }
        @Override public void onDestroy() {
        super.onDestroy();
        if (wm != null && overlayView != null) wm.removeView(overlayView);
        }
        }
        EOF

    - name: 10. APK Derle ve İmzala
      run: |
        BUILD_TOOLS="$HOME/android-sdk/build-tools/34.0.0"
        PLATFORM="$HOME/android-sdk/platforms/android-34/android.jar"
        mkdir -p app/build/res app/build/gen
        "$BUILD_TOOLS/aapt2" compile --dir app/src/main/res -o app/build/res/
        "$BUILD_TOOLS/aapt2" link -o app/build/base.apk -I "$PLATFORM" --manifest app/src/main/AndroidManifest.xml --java app/build/gen app/build/res/*.flat --auto-add-overlay --min-sdk-version 26 --target-sdk-version 34
        mkdir -p app/build/gen/com/darkforge/hiledurak
        cp app/build/gen/com/darkforge/hiledurak/R.java app/build/gen/com/darkforge/hiledurak/ 2>/dev/null || true
        mkdir -p app/build/classes
        javac -source 8 -target 8 -bootclasspath "$PLATFORM" -classpath "$PLATFORM" -d app/build/classes app/src/main/java/com/darkforge/hiledurak/*.java app/build/gen/com/darkforge/hiledurak/R.java
        mkdir -p app/build/dex
        "$BUILD_TOOLS/d8" --lib "$PLATFORM" --min-api 26 --output app/build/dex app/build/classes/com/darkforge/hiledurak/*.class
        cd app/build
        zip -j base.apk dex/classes.dex
        keytool -genkey -v -keystore df_key.jks -alias darkforge -keyalg RSA -keysize 2048 -validity 10000 -storepass darkforge123 -keypass darkforge123 -dname "CN=DarkForge, OU=Cyber, O=DF, L=TR, ST=TR, C=TR"
        "$BUILD_TOOLS/zipalign" -v -p 4 base.apk base_aligned.apk
        "$BUILD_TOOLS/apksigner" sign --ks df_key.jks --ks-pass pass:darkforge123 --key-pass pass:darkforge123 --min-sdk-version 26 --max-sdk-version 34 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out HileDurak.apk base_aligned.apk
        cp HileDurak.apk $GITHUB_WORKSPACE/

    - name: 11. APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: HileDurak-Final
        path: HileDurak.apk
